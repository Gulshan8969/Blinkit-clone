<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Blinkit | Groceries delivered in minutes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#" aria-label="Blinkit home">blink<span>it</span></a>

        <div class="delivery">
            <strong>Delivery in 10 minutes</strong>
            <span>Home · Add your address</span>
        </div>

        <form class="search" role="search">
            <label class="sr-only" for="site-search">Search for products</label>
            <span aria-hidden="true">⌕</span>
            <input id="site-search" type="search" placeholder="Search for products">
        </form>

        <button class="login" type="button">Login</button>
        <button class="cart" type="button"><span aria-hidden="true">🛒</span> My Cart</button>
    </header>

    <main>
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero-copy">
                <p class="eyebrow">YOUR EVERYDAY STORE</p>
                <h1 id="hero-title">Stock up on<br>daily essentials</h1>
                <p class="hero-description">Farm-fresh fruits, vegetables, eggs and more, delivered to your door.</p>
                <a class="shop-button" href="#categories">Start shopping <span aria-hidden="true">→</span></a>
            </div>
            
            <div class="hero-note"><span>⚡</span> Groceries at your doorstep in minutes</div>
        </section>

        <section class="categories" id="categories" aria-labelledby="categories-title">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">A LITTLE BIT OF EVERYTHING</p>
                    <h2 id="categories-title">Shop by category</h2>
                </div>
                <a href="#categories">See all <span aria-hidden="true">→</span></a>
            </div>

           
        </section>
    </main>
</body>
</html>
